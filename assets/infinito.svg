<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160" role="img" aria-labelledby="t d">
  <title id="t">Infinito arco-íris da neurodiversidade</title>
  <desc id="d">O símbolo do infinito em arco-íris, que representa a neurodiversidade, com um brilho dourado correndo por ele, como no infinito dourado do autismo.</desc>
  <style>
    .brilho { stroke-dasharray: 60 640; animation: corre 4s linear infinite; }
    @keyframes corre { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
    .respira { animation: respira 4s ease-in-out infinite; transform-origin: 160px 80px; }
    @keyframes respira { 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .brilho, .respira { animation: none; } .brilho { stroke-opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="arcoiris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C7A"/>
      <stop offset=".2" stop-color="#FF9F43"/>
      <stop offset=".4" stop-color="#F5C542"/>
      <stop offset=".6" stop-color="#39FF9E"/>
      <stop offset=".8" stop-color="#4EA8FF"/>
      <stop offset="1" stop-color="#B57BFF"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g class="respira">
    <path id="infinito" d="M160 80 C130 30 50 30 50 80 C50 130 130 130 160 80 C190 30 270 30 270 80 C270 130 190 130 160 80 Z"
          fill="none" stroke="url(#arcoiris)" stroke-width="16" stroke-linecap="round" filter="url(#neon)"/>
    <path class="brilho" d="M160 80 C130 30 50 30 50 80 C50 130 130 130 160 80 C190 30 270 30 270 80 C270 130 190 130 160 80 Z"
          fill="none" stroke="#FFE9A8" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
