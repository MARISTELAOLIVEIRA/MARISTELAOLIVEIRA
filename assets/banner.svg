<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Maristela Oliveira, a Stela · Professora de TI · Senac DF</title>
  <desc id="descricao">Uma placa de circuito escura: à esquerda, o nome Stela em verde neon e a frase "Ligo hardware, software e gente"; à direita, o chip central U1 ligado por trilhas a IoT, Python, nuvem, redes, IA e pessoas, com pulsos de luz correndo pelas trilhas.</desc>

  <style>
    .pulso { stroke-dasharray: 18 260; animation: corre 3.2s linear infinite; }
    .p2 { animation-delay: .5s; } .p3 { animation-delay: 1s; } .p4 { animation-delay: 1.5s; } .p5 { animation-delay: 2s; } .p6 { animation-delay: 2.5s; }
    @keyframes corre { from { stroke-dashoffset: 278; } to { stroke-dashoffset: 0; } }
    .cursor { animation: pisca 1s steps(1) infinite; }
    @keyframes pisca { 50% { opacity: 0; } }
    .led { animation: liga 2.4s ease-in-out infinite; }
    @keyframes liga { 50% { opacity: .35; } }
    .digita { animation: digita 4s steps(22) infinite; }
    @keyframes digita { 0% { width: 0; } 60%, 100% { width: 300px; } }
    @media (prefers-reduced-motion: reduce) {
      .pulso, .cursor, .led, .digita { animation: none; }
      .pulso { stroke-dasharray: none; stroke-opacity: .35; }
    }
  </style>

  <defs>
    <pattern id="furos" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.5" fill="#39FF9E" fill-opacity=".10"/>
    </pattern>
    <radialGradient id="brilhoVerde" cx="80%" cy="45%" r="55%">
      <stop offset="0" stop-color="#39FF9E" stop-opacity=".20"/>
      <stop offset="1" stop-color="#39FF9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoOuro" cx="0%" cy="100%" r="60%">
      <stop offset="0" stop-color="#F5C542" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="linhaDigitada"><rect class="digita" x="64" y="300" width="300" height="34"/></clipPath>
  </defs>

  <!-- A placa -->
  <rect width="1200" height="400" rx="20" fill="#07110C"/>
  <rect width="1200" height="400" rx="20" fill="url(#furos)"/>
  <rect width="1200" height="400" rx="20" fill="url(#brilhoVerde)"/>
  <rect width="1200" height="400" rx="20" fill="url(#brilhoOuro)"/>

  <!-- Texto -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="88" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#8FB8A6" letter-spacing="2">U1 · NÚCLEO DA PLACA</text>
    <text x="60" y="164" font-size="64" font-weight="800" fill="#E8FFF3">Maristela,</text>
    <text x="60" y="232" font-size="64" font-weight="800" fill="#39FF9E" filter="url(#neon)">ou só Stela.</text>
    <text x="64" y="276" font-size="24" fill="#CFE3D8">Professora de TI. Ligo hardware, software e gente.</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="21">
    <g clip-path="url(#linhaDigitada)">
      <text x="64" y="324"><tspan fill="#39FF9E">stela@placa</tspan><tspan fill="#8FB8A6"> ~ $ </tspan><tspan fill="#F5C542">sudo ensinar</tspan></text>
    </g>
    <rect class="cursor" x="368" y="306" width="11" height="22" fill="#39FF9E"/>
  </g>

  <!-- Trilhas de cobre do chip U1 até os periféricos -->
  <g fill="none" stroke="#C9973A" stroke-width="3" stroke-opacity=".55" stroke-linecap="round">
    <path id="t1" d="M880 150 V110 L850 80 H760"/>
    <path id="t2" d="M920 150 V70"/>
    <path id="t3" d="M960 150 V110 L990 80 H1080"/>
    <path id="t4" d="M880 250 V290 L850 320 H760"/>
    <path id="t5" d="M920 250 V330"/>
    <path id="t6" d="M960 250 V290 L990 320 H1080"/>
  </g>
  <g fill="none" stroke="#39FF9E" stroke-width="4" stroke-linecap="round">
    <path class="pulso" d="M880 150 V110 L850 80 H760"/>
    <path class="pulso p2" d="M920 150 V70"/>
    <path class="pulso p3" d="M960 150 V110 L990 80 H1080"/>
    <path class="pulso p4" d="M880 250 V290 L850 320 H760"/>
    <path class="pulso p5" d="M920 250 V330"/>
    <path class="pulso p6" d="M960 250 V290 L990 320 H1080"/>
  </g>

  <!-- Periféricos -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" text-anchor="middle">
    <g fill="#0B1A13" stroke="#39FF9E" stroke-opacity=".55" stroke-width="2">
      <rect x="664" y="60" width="96" height="40" rx="6"/>
      <rect x="872" y="30" width="96" height="40" rx="6"/>
      <rect x="1080" y="60" width="96" height="40" rx="6"/>
      <rect x="664" y="300" width="96" height="40" rx="6"/>
      <rect x="872" y="330" width="96" height="40" rx="6"/>
      <rect x="1080" y="300" width="96" height="40" rx="6"/>
    </g>
    <g fill="#E8FFF3">
      <text x="712" y="86">IoT</text>
      <text x="920" y="56">Python</text>
      <text x="1128" y="86">Nuvem</text>
      <text x="712" y="326">Redes</text>
      <text x="920" y="356">IA</text>
      <text x="1128" y="326">Pessoas</text>
    </g>
  </g>

  <!-- Chip U1 -->
  <g>
    <g fill="#9AA8A0">
      <rect x="852" y="136" width="8" height="16"/><rect x="876" y="136" width="8" height="16"/><rect x="900" y="136" width="8" height="16"/><rect x="924" y="136" width="8" height="16"/><rect x="948" y="136" width="8" height="16"/><rect x="972" y="136" width="8" height="16"/>
      <rect x="852" y="248" width="8" height="16"/><rect x="876" y="248" width="8" height="16"/><rect x="900" y="248" width="8" height="16"/><rect x="924" y="248" width="8" height="16"/><rect x="948" y="248" width="8" height="16"/><rect x="972" y="248" width="8" height="16"/>
    </g>
    <rect x="830" y="150" width="180" height="100" rx="10" fill="#0B1220" stroke="#39FF9E" stroke-width="3" filter="url(#neon)"/>
    <text x="920" y="186" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8FB8A6">U1 · DIY</text>
    <text x="920" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#39FF9E">STELA</text>
    <circle class="led" cx="994" cy="166" r="5" fill="#FF5C7A"/>
  </g>
</svg>
