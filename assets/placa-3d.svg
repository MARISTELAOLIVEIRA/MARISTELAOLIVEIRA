<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">A placa da Stela em 3D</title>
  <desc id="d">Uma placa de circuito verde em perspectiva, flutuando. No centro, o chip STELA; em volta, os chips Python, Nuvem, Redes, IA, IoT e Pessoas, ligados por trilhas de cobre com pulsos de luz e LEDs piscando.</desc>
  <style>
    .flutua { animation: flutua 5s ease-in-out infinite; }
    @keyframes flutua { 50% { transform: translateY(-12px); } }
    .sombra { animation: sombra 5s ease-in-out infinite; transform-origin: 600px 500px; }
    @keyframes sombra { 50% { transform: scale(.92); opacity: .5; } }
    .pulso { stroke-dasharray: 16 600; animation: corre 3s linear infinite; }
    @keyframes corre { from { stroke-dashoffset: 616; } to { stroke-dashoffset: 0; } }
    .led { animation: liga 1.8s ease-in-out infinite; }
    @keyframes liga { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .flutua, .sombra, .pulso, .led { animation: none; }
      .pulso { stroke-opacity: 0; }
    }
  </style>
